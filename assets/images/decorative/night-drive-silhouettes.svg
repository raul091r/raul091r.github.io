    <path d="M1026 488c20-81 40-157 57-227l14 3c-8 76-27 153-52 230z"/>
    <path d="M1088 276c-39-12-71-34-96-65 37 15 68 34 99 57-23-39-33-77-32-116 23 40 37 81 42 123 5-48 22-87 50-123-12 44-22 82-36 124 29-35 61-56 97-69-26 34-56 60-94 83 43-15 82-19 118-11-45 11-82 19-126 22z"/>
