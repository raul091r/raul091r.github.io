<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" aria-hidden="true">
  <title>Original neon night-drive landscape</title>
  <desc>Two unbranded sports-car silhouettes with palm trees on a neon horizon.</desc>
  <style>
    .car {
      animation: suspension-bob 2.8s ease-in-out infinite;
      transform-box: view-box;
    }

    .car--right {
      animation-delay: -1.1s;
    }

    .wheel {
      animation: wheel-spin 2.4s linear infinite;
      transform-box: view-box;
    }

    .wheel--left-front {
      transform-origin: 305px 384px;
    }

    .wheel--left-rear {
      transform-origin: 547px 384px;
      animation-delay: -0.5s;
    }

    .wheel--right-front {
      transform-origin: 732px 384px;
      animation-delay: -0.8s;
    }

    .wheel--right-rear {
      transform-origin: 950px 384px;
      animation-delay: -0.3s;
    }

    @keyframes suspension-bob {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes wheel-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .car,
      .wheel {
        animation: none;
      }
    }
  </style>
  <path d="M0 400h1200" fill="none" stroke="#FF2E97" stroke-opacity=".42" stroke-width="2"/>
